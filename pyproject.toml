[project]
name = "gcp-mcp"
version = "0.2.0"
description = "Read-only MCP server for Google Cloud"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.1",
    "fastmcp>=4.1.6",
    "starlette>=1.9.0",
    "structlog>=26.1.0",
    "google-api-python-client>=2.201.0",
    "pydantic-settings>=2.16.0",
    "cryptography>=50.0.2",
    "httpx2>=2.16.0",
    "google-auth[requests]>=2.62.0",
    "uritemplate>=4.2.0",
]

[project.scripts]
gcp-mcp = "gcp_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "joserfc>=1.8.0",
    "pytest>=9.2",
    "ruff>=0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-p", "tests.settings_env"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["gcp_mcp"]
