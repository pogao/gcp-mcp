[project]
name = "gcp-mcp"
version = "0.1.0"
description = "Read-only MCP server for Google Cloud"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.146.0",
    "pydantic>=2.14.1",
    "fastmcp>=4.1.6",
    "google-cloud-compute>=1.56.0",
    "starlette>=1.9.0",
    "structlog>=26.1.0",
    "google-cloud-storage>=3.17.1",
    "google-cloud-resource-manager>=1.19.0",
    "google-api-python-client>=2.201.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402", "F401"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["gcp_mcp"]
